<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VELORA® | Owner Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#080808;color:white;font-family:Arial,sans-serif;padding:20px}.login-box{width:100%;max-width:390px;padding:40px 30px;background:#111;border:1px solid #b99551;text-align:center}.logo{font-family:Georgia,serif;font-size:36px;letter-spacing:5px;color:#d6b36a}.subtitle{color:#aaa;letter-spacing:3px;font-size:11px;margin:10px 0 35px}h2{font-family:Georgia,serif;font-weight:normal}input{width:100%;padding:15px;margin:10px 0;background:#080808;border:1px solid #444;color:white;outline:none}input:focus{border-color:#d6b36a}button{width:100%;padding:15px;margin-top:15px;background:#d6b36a;border:0;color:#080808;font-weight:bold;cursor:pointer;letter-spacing:2px}button:hover{background:white}#message{font-size:13px;margin-top:20px;color:#d6b36a;overflow-wrap:anywhere}.forgot{display:block;margin-top:20px;color:#d6b36a;text-decoration:none;font-size:14px}.back{display:block;margin-top:25px;color:#aaa;text-decoration:none;font-size:13px}</style></head><body><div class="login-box"><div class="logo">VELORA®</div><div class="subtitle">THE ART OF ELEGANCE</div><h2>Owner Login</h2><input type="email" id="email" placeholder="Owner Email" autocomplete="username"><input type="password" id="password" placeholder="Password" autocomplete="current-password"><button id="login">SIGN IN</button><a href="#" class="forgot" id="forgot">Forgot Password?</a><p id="message"></p><a class="back" href="index.html">← Back to Store</a></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,signInWithEmailAndPassword,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";const firebaseConfig={apiKey:"AIzaSyBm0vK3se38fPbPl2zLkyMztcTP-2zpiU",authDomain:"af-brand-jabai.firebaseapp.com",projectId:"af-brand-jabai",storageBucket:"af-brand-jabai.firebasestorage.app",messagingSenderId:"794703482293",appId:"1:794703482293:web:b4de7e5a3af0723621dfc"};const app=initializeApp(firebaseConfig);const auth=getAuth(app);const email=document.getElementById("email");const password=document.getElementById("password");const message=document.getElementById("message");document.getElementById("login").onclick=async()=>{try{message.textContent="Signing in...";await signInWithEmailAndPassword(auth,email.value.trim(),password.value);message.textContent="Login successful!";window.location.href="admin.html";}catch(error){console.error(error);message.textContent="Login failed: "+error.code;}};document.getElementById("forgot").onclick=async(e)=>{e.preventDefault();if(!email.value.trim()){message.textContent="Enter your registered email first.";return;}try{await sendPasswordResetEmail(auth,email.value.trim());message.textContent="Password reset email sent! Check your inbox."; }catch(error){console.error(error);message.textContent="Error: "+error.code;}};</script></body></html>
