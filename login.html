<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VELORA® Owner Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#080808;font-family:Arial,sans-serif;color:#fff;padding:20px}.box{width:100%;max-width:380px;background:#111;padding:38px 30px;border:1px solid #b89548;border-radius:12px;text-align:center;box-shadow:0 0 35px #b8954820}.logo{font-size:34px;font-weight:bold;letter-spacing:5px;color:#d6b568}.sub{color:#aaa;font-size:12px;letter-spacing:3px;margin:10px 0 30px}h2{font-size:20px;letter-spacing:2px;margin-bottom:25px}input{width:100%;padding:14px;margin:9px 0;background:#080808;border:1px solid #555;border-radius:5px;color:white;font-size:15px;outline:none}input:focus{border-color:#d6b568}button{width:100%;padding:14px;margin-top:18px;background:#d6b568;color:#080808;border:0;border-radius:5px;font-weight:bold;letter-spacing:2px;cursor:pointer}button:hover{background:#f0d18a}.forgot{display:block;margin-top:20px;color:#d6b568;text-decoration:none;font-size:13px;cursor:pointer}.message{font-size:13px;margin-top:18px;line-height:1.5;color:#d6b568}.back{display:block;margin-top:25px;color:#aaa;text-decoration:none;font-size:12px}</style></head><body><div class="box"><div class="logo">VELORA®</div><div class="sub">THE ART OF ELEGANCE</div><h2>OWNER LOGIN</h2><input type="email" id="email" placeholder="Owner Email" autocomplete="email"><input type="password" id="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn" onclick="login()">SIGN IN</button><a class="forgot" onclick="forgotPassword()">Forgot Password?</a><div class="message" id="message"></div><a class="back" href="index.html">BACK TO WEBSITE</a></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script>const firebaseConfig={apiKey:"PASTE_YOUR_FIREBASE_WEB_API_KEY_HERE",authDomain:"af-brand-jabai.firebaseapp.com",projectId:"af-brand-jabai",storageBucket:"af-brand-jabai.firebasestorage.app",messagingSenderId:"794703482293",appId:"1:794703482293:web:b4de7e5a3af0723621dfc"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth();const message=document.getElementById("message");async function login(){const email=document.getElementById("email").value.trim();const password=document.getElementById("password").value;if(!email||!password){message.textContent="Please enter your email and password.";return}message.textContent="Signing in...";document.getElementById("loginBtn").disabled=true;try{await auth.signInWithEmailAndPassword(email,password);message.textContent="Login successful...";window.location.href="admin.html"}catch(error){message.textContent=error.message;document.getElementById("loginBtn").disabled=false}}async function forgotPassword(){const email=document.getElementById("email").value.trim();if(!email){message.textContent="Enter your email address first.";return}try{await auth.sendPasswordResetEmail(email);message.textContent="Password reset email sent. Check your inbox and spam folder."}catch(error){message.textContent=error.message}}document.getElementById("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});</script></body></html>
