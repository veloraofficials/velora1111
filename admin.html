<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VELORA Owner Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:white;font-family:Arial;padding:20px}.box{max-width:600px;margin:25px auto;background:#151515;padding:25px;border:1px solid #b89548;border-radius:10px}h1,h2{color:#d6b568;text-align:center}input,textarea,select{width:100%;padding:13px;margin:9px 0;background:#080808;color:white;border:1px solid #777;border-radius:5px}input[type=file]{border:0}button{padding:13px;background:#d6b568;color:#080808;border:0;border-radius:5px;font-weight:bold;cursor:pointer;margin:6px 0;width:100%}.product{border:1px solid #66512d;padding:12px;margin:12px 0;border-radius:6px}.product img{width:75px;height:75px;object-fit:cover;margin:4px}.hidden{display:none}.msg{color:#d6b568;text-align:center;white-space:pre-wrap}.actions{display:flex;gap:8px}.actions button{width:50%}
</style>
</head>
<body>
<div class="box">
<h1>VELORA®</h1>
<h2>OWNER DASHBOARD</h2>

<div id="login">
<h2>Owner Login</h2>
<input id="email" type="email" placeholder="Owner Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signIn()">SIGN IN</button>
<button onclick="resetPassword()">FORGOT PASSWORD</button>
</div>

<div id="dashboard" class="hidden">
<h2>ADD / EDIT PRODUCT</h2>
<input id="name" placeholder="Product Name">
<input id="price" type="number" placeholder="Price in PKR">
<textarea id="description" placeholder="Product Description"></textarea>
<textarea id="longDescription" placeholder="Full Product Details"></textarea>
<input id="sizes" placeholder="Sizes e.g. S,M,L,XL,XXL">
<select id="category">
<option value="Men">Men</option>
<option value="Women">Women</option>
<option value="Unisex">Unisex</option>
</select>
<label>Choose Product Photos</label>
<input id="photos" type="file" accept="image/*" multiple>
<button onclick="saveProduct()">UPLOAD / SAVE PRODUCT</button>
<button onclick="clearForm()">NEW PRODUCT</button>
<button onclick="signOut()">LOG OUT</button>
<h2>YOUR PRODUCTS</h2>
<div id="products">Loading...</div>
</div>
<div class="msg" id="message"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyBm0vK3se38fPbPl2zLkyMztcTP-2zpiU",
authDomain:"af-brand-jabai.firebaseapp.com",
projectId:"af-brand-jabai",
storageBucket:"af-brand-jabai.firebasestorage.app",
messagingSenderId:"794703482293",
appId:"1:794703482293:web:b4bde7e5a3af0723621dfc",
measurementId:"G-SCPD0MJV2F"
};

const IMGBB_KEY="f51f9d329e77ea0adf46395b82180d9c";

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

let editingId=null;
let oldImages=[];

const $=id=>document.getElementById(id);
const message=t=>$("message").textContent=t;

auth.onAuthStateChanged(user=>{
if(user){
if(user.uid!=="bCvxKOgghqaf4mCNBMXY5ufcUGc2"){
auth.signOut();
message("This account is not authorized.");
return;
}
$("login").classList.add("hidden");
$("dashboard").classList.remove("hidden");
loadProducts();
}else{
$("login").classList.remove("hidden");
$("dashboard").classList.add("hidden");
}
});

async function signIn(){
try{
await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value);
message("Login successful");
}catch(e){message(e.code+": "+e.message)}
}

async function resetPassword(){
try{
await auth.sendPasswordResetEmail($("email").value.trim());
message("Password reset email sent. Check your inbox.");
}catch(e){message(e.message)}
}

async function signOut(){await auth.signOut()}

async function uploadImage(file){
const form=new FormData();
form.append("image",file);
const response=await fetch("https://api.imgbb.com/1/upload?key="+IMGBB_KEY,{
method:"POST",body:form
});
const result=await response.json();
if(!result.success)throw new Error(result.error?.message||"Image upload failed");
return result.data.url;
}

async function saveProduct(){
const user=auth.currentUser;
if(!user||user.uid!=="bCvxKOgghqaf4mCNBMXY5ufcUGc2"){
message("Unauthorized account");return;
}
const name=$("name").value.trim();
const price=Number($("price").value);
if(!name||!price){
message("Enter product name and price");return;
}
try{
message("Uploading photos...");
const files=Array.from($("photos").files);
const images=[...oldImages];
for(const file of files)images.push(await uploadImage(file));
if(images.length===0){message("Please select at least one photo");return;}
const product={
name:name,
price:price,
description:$("description").value,
longDescription:$("longDescription").value,
sizes:$("sizes").value.split(",").map(s=>s.trim()).filter(Boolean),
category:$("category").value,
images:images,
image:images[0],
updatedAt:firebase.firestore.FieldValue.serverTimestamp()
};
if(editingId){
await db.collection("products").doc(editingId).update(product);
message("Product updated!");
}else{
product.createdAt=firebase.firestore.FieldValue.serverTimestamp();
await db.collection("products").add(product);
message("Product added!");
}
clearForm();
loadProducts();
}catch(e){message("ERROR: "+e.message)}
}

async function loadProducts(){
try{
const snap=await db.collection("products").get();
$("products").innerHTML="";
snap.forEach(doc=>{
const p=doc.data();
const div=document.createElement("div");
div.className="product";
const title=document.createElement("h3");
title.textContent=p.name||"Product";
const price=document.createElement("p");
price.textContent="PKR "+(p.price||0);
div.append(title,price);
(p.images||[p.image]).filter(Boolean).forEach(url=>{
const img=document.createElement("img");
img.src=url;
div.appendChild(img);
});
const actions=document.createElement("div");
actions.className="actions";
const edit=document.createElement("button");
edit.textContent="EDIT";
edit.onclick=()=>editProduct(doc.id,p);
const del=document.createElement("button");
del.textContent="DELETE";
del.onclick=()=>deleteProduct(doc.id);
actions.append(edit,del);
div.appendChild(actions);
$("products").appendChild(div);
});
if(snap.empty)$("products").textContent="No products yet.";
}catch(e){message(e.message)}
}

function editProduct(id,p){
editingId=id;
oldImages=p.images||(p.image?[p.image]:[]);
$("name").value=p.name||"";
$("price").value=p.price||"";
$("description").value=p.description||"";
$("longDescription").value=p.longDescription||"";
$("sizes").value=(p.sizes||[]).join(",");
$("category").value=p.category||"Men";
$("photos").value="";
message("Editing: "+p.name);
window.scrollTo(0,0);
}

async function deleteProduct(id){
if(!confirm("Delete this product?"))return;
try{
await db.collection("products").doc(id).delete();
message("Product deleted");
loadProducts();
}catch(e){message(e.message)}
}

function clearForm(){
editingId=null;
oldImages=[];
["name","price","description","longDescription","sizes","photos"].forEach(id=>$(id).value="");
$("category").value="Men";
}
</script>
</body>
</html>
