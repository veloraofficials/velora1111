<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VELORA® | Product Details</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#080808;color:#fff}.container{width:90%;max-width:1200px;margin:auto}nav{border-bottom:1px solid #292929;padding:22px 0}.nav{display:flex;justify-content:space-between;align-items:center}.logo{font-family:Georgia,serif;font-size:28px;letter-spacing:3px;color:#d6b36a}.logo span{color:#fff}.links a{margin-left:22px;text-decoration:none;color:#ddd;font-size:13px}.links a:hover{color:#d6b36a}.product{display:grid;grid-template-columns:1fr 1fr;gap:50px;padding:60px 0}.main-image{width:100%;max-height:650px;object-fit:cover;background:#151515}.gallery{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.gallery img{width:80px;height:100px;object-fit:cover;cursor:pointer;border:1px solid #555}.gallery img:hover{border-color:#d6b36a}.info h1{font-family:Georgia,serif;font-size:38px;margin-top:0}.price{font-size:24px;color:#d6b36a;margin:20px 0}.description{line-height:1.9;color:#bbb;white-space:pre-line}.sizes{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.size{border:1px solid #777;padding:11px 18px;cursor:pointer;color:#fff;background:transparent}.size:hover,.size.active{background:#d6b36a;color:#080808;border-color:#d6b36a}.btn{display:inline-block;padding:15px 35px;background:#d6b36a;color:#080808;text-decoration:none;border:0;cursor:pointer;font-weight:bold;letter-spacing:1px;margin-top:15px}.btn:hover{background:#fff}.other{padding:50px 0;border-top:1px solid #292929}.other h2{font-family:Georgia,serif;font-size:30px;color:#d6b36a}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:25px}.card{border:1px solid #292929;padding:15px;background:#111}.card img{width:100%;height:320px;object-fit:cover}.card h3{font-family:Georgia,serif;color:#fff}.card a{text-decoration:none;color:#fff}.card .price{font-size:17px}footer{text-align:center;padding:30px;border-top:1px solid #292929;color:#888;font-size:13px}@media(max-width:700px){.product{grid-template-columns:1fr;gap:30px}.products{grid-template-columns:1fr}.links a{margin-left:9px;font-size:11px}.logo{font-size:22px}.info h1{font-size:30px}}</style></head><body><nav><div class="container nav"><div class="logo">VELORA<span>®</span></div><div class="links"><a href="index.html">Collection</a><a href="index.html#about">About</a><a href="index.html#contact">Contact</a></div></div></nav><div class="container"><div id="product" class="product">Loading VELORA product...</div><section class="other"><h2>YOU MAY ALSO LIKE</h2><div id="products" class="products">Loading products...</div></section></div><footer>VELORA® — THE ART OF ELEGANCE<br><br>© 2026 VELORA. All Rights Reserved.</footer><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getFirestore,collection,getDocs,doc,getDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyBm0vK3se38fPbPl2zLkyMztcTP-2zpiU",authDomain:"af-brand-jabai.firebaseapp.com",projectId:"af-brand-jabai",storageBucket:"af-brand-jabai.firebasestorage.app",messagingSenderId:"794703482293",appId:"1:794703482293:web:b4de7e5a3af0723621dfc"};const app=initializeApp(firebaseConfig);const db=getFirestore(app);const params=new URLSearchParams(window.location.search);const productId=params.get("id");const productBox=document.getElementById("product");let selectedSize="";function safeText(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));}async function loadProduct(){if(!productId){productBox.textContent="Product not found.";return;}try{const productRef=doc(db,"products",productId);const productSnap=await getDoc(productRef);if(!productSnap.exists()){productBox.textContent="Product not found.";return;}const p=productSnap.data();let allImages=[];if(p.image)allImages.push(p.image);if(Array.isArray(p.images))allImages=allImages.concat(p.images);allImages=[...new Set(allImages.filter(Boolean))];const sizes=Array.isArray(p.sizes)?p.sizes:[];selectedSize="";productBox.innerHTML=`<div><img id="mainImage" class="main-image" src="${safeText(allImages[0]||"")}" alt="${safeText(p.name)}"><div class="gallery">${allImages.map((img,index)=>`<img src="${safeText(img)}" alt="Product photo ${index+1}">`).join("")}</div></div><div class="info"><h1>${safeText(p.name||"VELORA Collection")}</h1><div class="price">Rs. ${safeText(p.price||"Contact for price")}</div><div class="description">${safeText(p.longDescription||p.description||"")}</div><h3>SELECT YOUR SIZE</h3><div class="sizes">${sizes.length?sizes.map(size=>`<button class="size" type="button" data-size="${safeText(size)}">${safeText(size)}</button>`).join(""):"Size information not available"}</div><button id="buyNow" class="btn">ORDER ON WHATSAPP</button></div>`;document.querySelectorAll(".gallery img").forEach(img=>img.addEventListener("click",()=>{document.getElementById("mainImage").src=img.src;}));const sizeButtons=document.querySelectorAll(".size");sizeButtons.forEach(button=>button.addEventListener("click",()=>{selectedSize=button.dataset.size;sizeButtons.forEach(b=>b.classList.remove("active"));button.classList.add("active");}));document.getElementById("buyNow").addEventListener("click",()=>{if(sizes.length&&!selectedSize){alert("Please select a size first.");return;}const message=`Hello VELORA! I want to order:\nProduct: ${p.name||""}\nPrice: Rs. ${p.price||""}\nSize: ${selectedSize||"Not specified"}`;window.open("https://wa.me/923417884713?text="+encodeURIComponent(message),"_blank");});}catch(error){console.error(error);productBox.textContent="Error loading product. Please try again.";}}async function loadOtherProducts(){const box=document.getElementById("products");try{const snapshot=await getDocs(collection(db,"products"));box.innerHTML="";snapshot.forEach(docSnap=>{if(docSnap.id===productId)return;const p=docSnap.data();const card=document.createElement("div");card.className="card";card.innerHTML=`<a href="product.html?id=${encodeURIComponent(docSnap.id)}"><img src="${safeText(p.image||"")}" alt="${safeText(p.name)}"><h3>${safeText(p.name||"")}</h3></a><div class="price">Rs. ${safeText(p.price||"")}</div>`;box.appendChild(card);});if(!box.children.length)box.textContent="No other products available.";}catch(error){console.error(error);box.textContent="Unable to load other products.";}}loadProduct();loadOtherProducts();</script></body></html>
